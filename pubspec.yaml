name: infra_mind
description: "RoadSense - AI-Powered Infrastructure Asset Monitoring & Predictive Maintenance Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # AI
  google_generative_ai: ^0.4.6

  # Maps
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Charts
  fl_chart: ^0.70.2

  # State Management
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # UI / Animations
  lottie: ^3.3.1
  shimmer: ^3.0.0
  animated_text_kit: ^4.2.3
  flutter_animate: ^4.5.2
  percent_indicator: ^4.2.4

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  http: ^1.3.2
  permission_handler: ^11.4.0
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  timeline_tile: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
